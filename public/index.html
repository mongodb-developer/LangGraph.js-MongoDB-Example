<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLD Blog Assistant | itsthatlady.dev</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 700px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 80vh;
    }

    .chat-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .chat-header h1 {
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    .chat-header p {
      opacity: 0.9;
      font-size: 0.9rem;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 80%;
      padding: 12px 18px;
      border-radius: 18px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 5px;
    }

    .message.assistant {
      background: #f0f0f0;
      color: #333;
      align-self: flex-start;
      border-bottom-left-radius: 5px;
    }

    .message.assistant a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
    }

    .message.assistant a:hover {
      text-decoration: underline;
    }

    .message.assistant strong {
      font-weight: 600;
    }

    .chat-input-container {
      padding: 20px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      padding: 15px 20px;
      border: 2px solid #eee;
      border-radius: 25px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .chat-input:focus {
      border-color: #667eea;
    }

    .send-button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 25px;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .send-button:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .send-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .typing-indicator {
      display: flex;
      gap: 5px;
      padding: 15px 20px;
      background: #f0f0f0;
      border-radius: 18px;
      align-self: flex-start;
      border-bottom-left-radius: 5px;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: #999;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .new-chat-btn {
      background: transparent;
      border: 2px solid rgba(255,255,255,0.5);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 10px;
      transition: all 0.3s;
    }

    .new-chat-btn:hover {
      background: rgba(255,255,255,0.2);
      border-color: white;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>✨ TLD Blog Assistant</h1>
      <p>Ask me anything about articles on itsthatlady.dev</p>
      <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
    </div>
    
    <div class="chat-messages" id="messages">
      <div class="message assistant">
        Hi! 👋 I'm your blog assistant. Ask me about AI, machine learning, coding tutorials, or any topic from the blog!
      </div>
    </div>
    
    <div class="chat-input-container">
      <input 
        type="text" 
        class="chat-input" 
        id="userInput" 
        placeholder="Ask about a blog post..." 
        onkeypress="handleKeyPress(event)"
      >
      <button class="send-button" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    let threadId = null;

    // Convert markdown-style formatting to HTML
    function formatResponse(text) {
      return text
        // Convert markdown links [text](url) to HTML links
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
        // Convert **bold** to <strong>
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        // Convert *italic* to <em>
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        // Convert newlines to <br>
        .replace(/\n/g, '<br>')
        // Convert bullet points
        .replace(/^- (.+)$/gm, '• $1');
    }

    function addMessage(content, isUser) {
      const messagesContainer = document.getElementById('messages');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;
      messageDiv.innerHTML = isUser ? content : formatResponse(content);
      messagesContainer.appendChild(messageDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function showTyping() {
      const messagesContainer = document.getElementById('messages');
      const typingDiv = document.createElement('div');
      typingDiv.className = 'typing-indicator';
      typingDiv.id = 'typing';
      typingDiv.innerHTML = '<span></span><span></span><span></span>';
      messagesContainer.appendChild(typingDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function hideTyping() {
      const typing = document.getElementById('typing');
      if (typing) typing.remove();
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const message = input.value.trim();
      
      if (!message) return;
      
      addMessage(message, true);
      input.value = '';
      sendBtn.disabled = true;
      showTyping();

      try {
        const url = threadId ? `/chat/${threadId}` : '/chat';
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        
        if (data.threadId) {
          threadId = data.threadId;
        }

        hideTyping();
        addMessage(data.response, false);
      } catch (error) {
        hideTyping();
        addMessage('Sorry, something went wrong. Please try again.', false);
        console.error('Error:', error);
      }

      sendBtn.disabled = false;
      input.focus();
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    function startNewChat() {
      threadId = null;
      const messagesContainer = document.getElementById('messages');
      messagesContainer.innerHTML = `
        <div class="message assistant">
          Hi! 👋 I'm your blog assistant. Ask me about AI, machine learning, coding tutorials, or any topic from the blog!
        </div>
      `;
    }

    // Focus input on load
    document.getElementById('userInput').focus();
  </script>
</body>
</html>
